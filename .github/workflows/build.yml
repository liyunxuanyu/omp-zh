name: build-windows-zh

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "上游 tag（默认 v18.22.2）"
        required: false
        default: "v18.22.2"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Clone upstream
        run: |
          TAG="${{ github.event.inputs.upstream_tag || 'v18.22.2' }}"
          echo "UPSTREAM_TAG=$TAG" >> $GITHUB_ENV
          git clone --depth 1 --branch "$TAG" https://github.com/can1357/oh-my-pi.git upstream
          echo "upstream commit: $(git -C upstream rev-parse --short HEAD)"

      - name: Install dependencies
        working-directory: upstream
        run: bun install --frozen-lockfile

      - name: Add native addons (win32 + linux)
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/upstream/packages/natives/native"
          mkdir -p "$DEST" /tmp/nat
          cd /tmp/nat
          rm -f ./*.tgz; rm -rf ./ext-*
          for target in win32-x64 linux-x64; do
            npm pack "@oh-my-pi/pi-natives-${target}@18.22.2" >/dev/null
            TGZ="$(ls -t *pi-natives-${target}-*.tgz | head -1)"
            mkdir -p "ext-${target}"
            tar xzf "$TGZ" -C "ext-${target}"
            cp "ext-${target}"/package/*.node "$DEST"/
          done
          ls -la "$DEST"

      - name: Build translation map and patch upstream
        run: |
          node scripts/build-map.mjs
          node scripts/apply.mjs --upstream upstream
          node scripts/coverage.mjs || true
          echo "=== 抽样检查补丁是否生效 ==="
          grep -c "检查更新" upstream/packages/coding-agent/src/modes/settings.ts || true
          grep -n "检查更新" upstream/packages/coding-agent/src/modes/settings.ts | head -3 || true
          grep -c "提供商" upstream/packages/coding-agent/src/session/settings.ts || true

      - name: Smoke test on Linux build
        working-directory: upstream/packages/coding-agent
        run: |
          bun run build
          ./dist/omp --version
          ./dist/omp --help > /tmp/help.txt 2>&1 || true
          echo "=== 前 25 行 ==="
          head -25 /tmp/help.txt
          echo "=== 中文字符统计 ==="
          python3 - <<'PY2'
          import re, sys
          t = open('/tmp/help.txt', encoding='utf-8', errors='ignore').read()
          n = len(re.findall(r'[\u4e00-\u9fff]', t))
          print(f"CJK: {n}")
          sys.exit(0 if n > 200 else 1)
          PY2

      - name: Cross-compile Windows x64
        working-directory: upstream/packages/coding-agent
        run: CROSS_TARGET=win32-x64 bun run build

      - name: Verify Chinese strings in binary
        run: |
          BIN="$(find upstream -maxdepth 4 -type f -name 'omp-*' -size +20M | head -1)"
          echo "BIN=$BIN"
          python3 - "$BIN" <<'PY2'
          import sys,re
          data=open(sys.argv[1],'rb').read()
          u8=len(re.findall(rb'(?:[\xe4-\xe9][\x80-\xbf]{2}){2,}', data))
          # UTF-16LE CJK 连续片段
          u16=len(re.findall(rb'(?:[\x00-\xff][\x4e-\x9f]){2,}', data))
          print(f"UTF-8 CJK 片段: {u8}, UTF-16LE CJK 片段: {u16}")
          for probe in ["检查更新","提供商","子代理","会话","上下文"]:
              print(probe, "utf8:", data.count(probe.encode()), "utf16:", data.count(probe.encode('utf-16-le')))
          PY2

      - name: Collect artifact
        run: |
          echo "=== dist 内容 ==="
          ls -la upstream/packages/coding-agent/dist || true
          echo "=== 全仓搜索 omp-* 产物 ==="
          find upstream -maxdepth 4 -type f \( -name 'omp-*' -o -name 'omp' \) -printf '%p %s\n' | head -20
          mkdir -p out
          BIN="$(find upstream -maxdepth 4 -type f -name 'omp-*' -size +20M | head -1)"
          test -n "$BIN" || { echo "未找到构建产物"; exit 1; }
          cp "$BIN" out/omp.exe
          sha256sum out/omp.exe | tee out/omp.exe.sha256
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: omp-windows-x64-zh-${{ env.UPSTREAM_TAG }}
          path: out/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
          generate_release_notes: true
